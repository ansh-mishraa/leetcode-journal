<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none" role="img" aria-label="KeepSolved">
  <title>KeepSolved</title>
  <style>
    .tile { fill: #fff; stroke: rgba(18,21,28,0.1); }
    .check { stroke: #12151C; }
    .keep { fill: #12151C; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #161B24; stroke: rgba(255,255,255,0.08); }
      .check { stroke: #ECEEF2; }
      .keep { fill: #ECEEF2; }
    }
  </style>
  <g transform="translate(0,4)">
