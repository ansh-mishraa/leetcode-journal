      <stop stop-color="#10B981"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="ksw" x1="100" y1="10" x2="210" y2="40">
      <stop stop-color="#10B981"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#F59E0B"/>
